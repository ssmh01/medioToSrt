[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autosrt-aligner"
version = "0.1.0"
description = "Forced-alignment SRT/VTT generator for AI narration audio and source scripts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "python-multipart>=0.0.9",
  "imageio-ffmpeg>=0.5.1",
  "mlx-audio>=0.4.4,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "nagisa>=0.3.0,<0.4",
  "soynlp>=0.0.493,<0.1",
  "jieba==0.42.1",
  "SudachiPy==0.7.0",
  "SudachiDict-core==20260723.1",
  "spacy==3.8.16",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
]

[project.scripts]
autosrt-aligner = "autosrt_aligner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autosrt_aligner = ["data/*"]
